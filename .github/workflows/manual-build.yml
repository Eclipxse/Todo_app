name: Build Eclipxse for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out Eclipxse
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use HTTPS for Git dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run buildAllElectron:noTests:prod

      - name: Package installer and portable app
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Eclipxse executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Eclipxse-Windows-x64
          path: .tmp/app-builds/Eclipxse-*.exe
          if-no-files-found: error
