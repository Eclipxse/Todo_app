name: Build Eclipxse for Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eclipxse-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Eclipxse
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Use HTTPS for Git dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        run: npm ci

      - name: Build Android web assets
        run: npm run buildFrontend:stageWeb:unminified

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Test and build APK
        working-directory: android
        run: ./gradlew testFdroidDebugUnitTest assembleFdroidDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p .tmp/android-build
          cp android/app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk .tmp/android-build/Eclipxse-Todo-Android.apk
          cd .tmp/android-build
          sha256sum Eclipxse-Todo-Android.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Eclipxse-Todo-Android
          path: .tmp/android-build/
          if-no-files-found: error
          retention-days: 30
