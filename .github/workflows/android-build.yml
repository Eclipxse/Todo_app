name: Build Eclipxse for Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eclipxse-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Eclipxse
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Use HTTPS for Git dependencies
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        run: npm ci

      - name: Build Android web assets
        run: npm run buildFrontend:stageWeb:unminified

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Test and build APK
        working-directory: android
        run: ./gradlew testFdroidDebugUnitTest assembleFdroidDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p .tmp/android-build
          cp android/app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk .tmp/android-build/Eclipxse-Todo-Android.apk
          cd .tmp/android-build
          sha256sum Eclipxse-Todo-Android.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Eclipxse-Todo-Android
          path: .tmp/android-build/
          if-no-files-found: error
          retention-days: 30
